language: "python"
layer: "application"

tasks:
  build:
    command: "uv run main.py"
    outputs:
      - "output"
    # Data is fetched from Google Sheets, so local inputs can't tell when it is stale
    options:
      cache: false
  lint:
    command: "uv run ruff check ."
  format:
    command: "uv run ruff format ."
